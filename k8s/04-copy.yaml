apiVersion: batch/v1
kind: Job
metadata:
  name: copy-data
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: copy
          image: amazon/aws-cli:latest
          command: ["/bin/sh", "-c"]
          args:
            - >-
              aws --endpoint-url http://rustfs:9000 s3 mb s3://hh-lake ;
              aws --endpoint-url http://host.docker.internal:9000 s3 cp s3://hh-lake/raw/it_vacancies_2024.csv - |
              aws --endpoint-url http://rustfs:9000 s3 cp - s3://hh-lake/raw/it_vacancies_2024.csv &&
              aws --endpoint-url http://rustfs:9000 s3 ls s3://hh-lake/raw/
          env:
            - name: AWS_ACCESS_KEY_ID
              value: rustfsadmin
            - name: AWS_SECRET_ACCESS_KEY
              value: rustfsadmin
            - name: AWS_DEFAULT_REGION
              value: us-east-1
