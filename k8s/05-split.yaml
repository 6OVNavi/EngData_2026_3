apiVersion: batch/v1
kind: Job
metadata:
  name: pairs-split
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: pairs
          image: hw5-pairs:1
          imagePullPolicy: Never
          args: ["split"]
          env:
            - name: S3_ENDPOINT
              value: http://rustfs:9000
            - name: PARTS
              value: "4"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 512Mi
