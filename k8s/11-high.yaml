apiVersion: batch/v1
kind: Job
metadata:
  name: high-job
spec:
  template:
    spec:
      restartPolicy: Never
      priorityClassName: high-priority
      containers:
        - name: work
          image: busybox:1.36
          command: ["sleep", "90"]
          resources:
            requests:
              cpu: CPU_REQ
              memory: 64Mi
